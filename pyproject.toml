[project]
name = "cadre"
version = "0.1.0"
description = "Cadre — run an organisation of AI agents (builders, reviewers, verifiers, deciders) on the free model APIs you already have."
readme = "README.md"
authors = [
    { name = "Rithik Krishna", email = "317035893+Daemon-VI@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.8",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
cadre = "cadre.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B023: step factories are awaited inside the loop iteration that defines them
ignore = ["E501", "B008", "B023", "UP007"]
