[project]
name = "cadre-ai"
version = "0.1.0"
description = "A team of AI agents that builds or finishes a project on free model keys, staying inside every provider's limits."
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agents", "multi-agent", "llm", "free-tier", "rate-limit", "groq", "gemini", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
authors = [
    { name = "Rithik Krishna", email = "317035893+Daemon-VI@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.8",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Daemon-VI/cadre"
Source = "https://github.com/Daemon-VI/cadre"
Issues = "https://github.com/Daemon-VI/cadre/issues"
Changelog = "https://github.com/Daemon-VI/cadre/blob/main/CHANGELOG.md"

[project.scripts]
cadre = "cadre.cli:main"
cadre-ai = "cadre.cli:main"  # so `uvx cadre-ai …` works without --from

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cadre"  # the distribution is cadre-ai (`cadre` is taken on PyPI); the import and command stay cadre

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B023: step factories are awaited inside the loop iteration that defines them
ignore = ["E501", "B008", "B023", "UP007"]
