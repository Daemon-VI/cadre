# The VS Code extension (editors/vscode, FR-19, ADR-029).
# Every push / PR that touches it: typecheck, lint, unit tests and a .vsix on Linux and Windows,
# plus the Electron integration test on Linux under xvfb (never run on the 7.7 GB laptop).
# A `vscode-v<version>` tag on main publishes the same .vsix to the VS Code Marketplace and to
# Open VSX (AC-19.5), each only if its token secret is configured.
name: vscode

on:
  push:
    branches: ["**"]
    tags: ["vscode-v*"]          # path filters are not evaluated for tag pushes
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: editors/vscode

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit -p . && npx tsc --noEmit -p src/webview
      - name: lint
        run: npx eslint .
      - name: unit tests
        run: npm test
      - name: package
        run: npx @vscode/vsce package --no-dependencies -o cadre.vsix
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: cadre-vsix
          path: editors/vscode/cadre.vsix
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Electron integration test
        run: xvfb-run -a npm run test:integration

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: [check, integration]
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: the tag is on main and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "${GITHUB_REF_NAME#vscode-v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - name: package
        run: npx @vscode/vsce package --no-dependencies -o cadre.vsix
      - name: publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --no-dependencies --packagePath cadre.vsix -p "$VSCE_PAT"
      - name: publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish cadre.vsix -p "$OVSX_PAT"
      - name: note a skipped registry
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: echo "::warning::VSCE_PAT or OVSX_PAT is not set; that registry was skipped."
