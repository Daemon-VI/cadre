name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - name: Scheduler unit files pass the OS's own checker
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="$RUNNER_TEMP/units"; mkdir -p "$out"
          uv run python - "$out" <<'EOF'
          import sys
          from pathlib import Path
          from cadre import scheduler
          out = Path(sys.argv[1])
          for name, text in scheduler.systemd_units(30).items():
              (out / name).write_text(text)
          (out / "cadre.plist").write_text(scheduler.launchd_plist(30))
          EOF
          if [ "$RUNNER_OS" = "Linux" ]; then systemd-analyze verify --user "$out/cadre-resume.service" "$out/cadre-resume.timer"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then plutil -lint "$out/cadre.plist"; fi

  hygiene:
    name: licences, history, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: No copyleft runtime dependency
        run: uv run --isolated --no-project --with ".[mcp]" --with pip-licenses python tools/check_licences.py
      - name: Owner identity on every commit, no private names, no key shapes
        run: python3 tools/check_history.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheel:
    name: wheel installs and runs · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv run --no-project python tools/wheel_smoke.py

  containment:
    # FR-22 / AC-22.8: hostile checks in real containers must fail to reach the network, write
    # outside /work, read a planted key, fork past the pids limit or allocate past the memory cap;
    # a normal check must pass. Linux only: GitHub's Ubuntu runners have Docker and Podman.
    name: containment · ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Pull the pinned test image (Cadre never pulls one itself)
        run: |
          ${{ matrix.runtime }} --version
          ${{ matrix.runtime }} pull "$(uv run python -c 'from tests.test_containment import IMAGE; print(IMAGE)')"
      - name: Containment tests
        env:
          CADRE_CONTAINMENT: ${{ matrix.runtime }}
          CADRE_CONTAINMENT_REPORT: ${{ runner.temp }}/containment.jsonl
        run: uv run pytest -q -rA tests/test_containment.py
      - name: Outcomes
        if: always()
        run: |
          { echo "### ${{ matrix.runtime }}"; echo '```'; cat "$RUNNER_TEMP/containment.jsonl" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/containment.jsonl" || true
