name: Release

# A full version tag (v1.0.0, v1.0.0rc1) publishes: wheel + sdist → TestPyPI → PyPI (trusted
# publishing, no token), standalone builds for Windows/macOS/Linux → the GitHub Release, and an
# image → GHCR. The Action's moving major tag (`v1`, for `uses: Daemon-VI/cadre@v1`) and the
# extension's `vscode-v*` tags never match. `workflow_dispatch` builds and smoke-tests everything
# without publishing anything.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: uv build
      - run: uv run --no-project python tools/wheel_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cadre-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cadre-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  binaries:
    name: standalone · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run --with pyinstaller python packaging/build_binary.py
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: |
            dist/cadre-*.zip
            dist/cadre-*.tar.gz

  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/daemon-vi/cadre
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cadre:smoke
      - name: Smoke test — non-root, /data, demo run
        run: |
          test "$(docker run --rm --entrypoint id cadre:smoke -u)" = "10001"
          docker run --rm cadre:smoke --version
          docker run --rm cadre:smoke run decision-board "Should we open a second office?" --demo | tee out.txt
          grep -q succeeded out.txt
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [dist, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/dist/*
            artifacts/binary-*/*
          body: |
            Install: `pipx install cadre-ai` (or `uv tool install cadre-ai`), or run it without installing:
            `uvx --from cadre-ai cadre --version`. See CHANGELOG.md for what changed.

            The standalone builds are **unsigned**: Windows SmartScreen and macOS Gatekeeper will warn.
            On macOS, run `xattr -d com.apple.quarantine cadre/cadre` once after unpacking. Checks that
            use `{python}` need a Python on PATH in a standalone build.
